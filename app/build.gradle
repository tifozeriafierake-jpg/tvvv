plugins { id 'com.android.application' }
android {
    namespace 'al.titrashqip.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'al.titrashqip.tv'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    signingConfigs { fixed { storeFile file('titra.jks'); storePassword 'titrashqip'; keyAlias 'titra'; keyPassword 'titrashqip' } }
    buildTypes { debug { signingConfig signingConfigs.fixed } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
