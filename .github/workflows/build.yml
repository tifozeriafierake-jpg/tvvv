name: Ndërto APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: TitraShqip-APK, path: app/build/outputs/apk/debug/app-debug.apk }
      - run: cp app/build/outputs/apk/debug/app-debug.apk TitraShqip.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Titra Shqip ${{ github.run_number }}
          files: TitraShqip.apk
