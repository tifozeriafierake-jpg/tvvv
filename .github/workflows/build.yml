name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: 8KTV-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Ruaj APK-në në degën 8ktv-apk
        run: |
          mkdir out && cp app/build/outputs/apk/release/*.apk out/8KTV.apk
          cd out
          git init -q -b 8ktv-apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add 8KTV.apk
          git commit -qm "APK nga ${GITHUB_SHA::7} [skip ci]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" 8ktv-apk
